<svg xmlns="http://www.w3.org/2000/svg" width="48" height="136" viewBox="0 0 48 136">
  <!-- G36C held sprite, own art (surviv.io-rebirth): top-down view, barrel up, butt flush at the bottom. -->
  <!-- folding stock seen from above (under the right hand in game): solid top strut with a groove, butt pad flush -->
  <rect x="17" y="104" width="14" height="24" fill="#484848" stroke="#000" stroke-width="8"/>
  <path d="M24 108v16" stroke="#3a3a3a" stroke-width="3"/>
  <rect x="12" y="128" width="24" height="8" rx="2" fill="#000"/>
  <!-- hinge block, pin knuckle on the right -->
  <rect x="16" y="90" width="16" height="12" rx="1" fill="#000"/>
  <circle cx="34" cy="96" r="4" fill="#000"/>
  <!-- polymer receiver; the carry handle covers its whole top, highlight strip along the handle -->
  <path d="M14 48h20v38l-2 2H16l-2-2z" fill="#484848" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <rect x="22" y="58" width="4" height="22" fill="#8f8f8f"/>
  <!-- charging lever folded out to the left under the front of the handle -->
  <rect x="5" y="56" width="10" height="4" fill="#000"/>
  <rect x="2" y="52" width="5" height="12" rx="2" fill="#000"/>
  <!-- optic eyepiece at the rear of the handle -->
  <rect x="15" y="82" width="18" height="10" rx="4" fill="#000"/>
  <!-- short handguard: flared front lip, three rows of vents -->
  <path d="M12 20h24v4l-2 2v22H14V26l-2-2z" fill="#484848" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M18 28.5h12M18 34.5h12M18 40.5h12" stroke="#000" stroke-width="3"/>
  <!-- front sight ears of the carry handle, grey post -->
  <rect x="15" y="47" width="18" height="9" rx="1" fill="#000"/>
  <rect x="22" y="50" width="4" height="4" fill="#8f8f8f"/>
  <!-- bare barrel and flash hider with two slots -->
  <rect x="20" y="8" width="8" height="12" fill="#000"/>
  <rect x="17" y="1" width="14" height="9" rx="2" fill="#000"/>
  <rect x="20" y="2" width="2" height="6" fill="#8f8f8f"/>
  <rect x="26" y="2" width="2" height="6" fill="#8f8f8f"/>
</svg>
