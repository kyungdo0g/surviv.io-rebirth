<svg xmlns="http://www.w3.org/2000/svg" width="60" height="232" viewBox="0 0 60 232">
  <!-- PGM Hecate II held sprite, own art: seen from above, barrel up; black anti-materiel rifle with a big box muzzle brake. -->
  <!-- skeleton stock from above: hinge block, beam, cheek rest, butt pad (under the right hand in game) -->
  <rect x="25" y="184" width="10" height="40" fill="#000"/>
  <rect x="23" y="195" width="14" height="24" rx="1" fill="#484848" stroke="#000" stroke-width="6"/>
  <rect x="16" y="222" width="28" height="10" rx="3" fill="#000"/>
  <rect x="21" y="184" width="18" height="8" rx="1" fill="#000"/>
  <!-- barrel reinforce: thick cylinder from the taper back into the receiver -->
  <path d="M20 72h20l3 5v35H17V77z" fill="#484848" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <!-- receiver box (steel), 34 wide including the outline; it runs back under the eyepiece -->
  <rect x="16" y="114" width="28" height="70" rx="2" fill="#555555" stroke="#000" stroke-width="6"/>
  <!-- bolt handle on the right, clear of the receiver outline: arm + ball -->
  <path d="M46 158l6 7" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="53" cy="167" r="4.5" fill="#000"/>
  <!-- top rail: slots where it shows on the reinforce in front of the scope -->
  <rect x="26" y="88" width="8" height="80" fill="#000"/>
  <rect x="28" y="93" width="4" height="2" fill="#555555"/>
  <rect x="28" y="99" width="4" height="2" fill="#555555"/>
  <rect x="28" y="105" width="4" height="2" fill="#555555"/>
  <rect x="28" y="111" width="4" height="2" fill="#555555"/>
  <!-- scope from above: bell, tube with the highlight strip, turret saddle with side knobs past the receiver, elevation cap, eyepiece -->
  <rect x="22" y="120" width="16" height="12" rx="2" fill="#000"/>
  <rect x="25" y="130" width="10" height="38" fill="#000"/>
  <rect x="23" y="166" width="14" height="10" rx="2" fill="#000"/>
  <rect x="28" y="134" width="4" height="11" fill="#8f8f8f"/>
  <rect x="28" y="157" width="4" height="7" fill="#8f8f8f"/>
  <rect x="10" y="147" width="40" height="8" rx="3" fill="#000"/>
  <rect x="21" y="145" width="18" height="12" rx="2" fill="#000"/>
  <circle cx="30" cy="151" r="5" fill="#000"/>
  <!-- bipod clamp band with its ears standing out past the reinforce -->
  <rect x="12" y="80" width="36" height="6" rx="1" fill="#000"/>
  <rect x="7" y="77" width="8" height="12" rx="2" fill="#000"/>
  <rect x="45" y="77" width="8" height="12" rx="2" fill="#000"/>
  <!-- heavy barrel, tapering to the muzzle, a flute down its middle -->
  <path d="M23 34h14l2 39H21z" fill="#000"/>
  <rect x="29" y="40" width="2" height="28" fill="#555555"/>
  <!-- box muzzle brake, the biggest and squarest part: 44 x 30, two port bands; the clamp collar behind it -->
  <rect x="18" y="29" width="24" height="8" rx="1" fill="#000"/>
  <path d="M12 1h36l4 4v22l-4 4H12l-4-4V5z" fill="#000"/>
  <rect x="10" y="9" width="40" height="4" fill="#555555"/>
  <rect x="10" y="19" width="40" height="4" fill="#555555"/>
</svg>
