<svg xmlns="http://www.w3.org/2000/svg" width="60" height="232" viewBox="0 0 60 232">
  <!-- PGM Hecate II held sprite, own art: seen from above, barrel up; black anti-materiel rifle with a box muzzle brake. -->
  <!-- skeleton stock from above: hinge block, beam, cheek rest, butt pad (under the right hand in game) -->
  <rect x="25" y="184" width="10" height="40" fill="#000"/>
  <rect x="23" y="195" width="14" height="24" rx="1" fill="#484848" stroke="#000" stroke-width="6"/>
  <rect x="16" y="222" width="28" height="10" rx="3" fill="#000"/>
  <rect x="21" y="184" width="18" height="8" rx="1" fill="#000"/>
  <!-- barrel reinforce: thick cylinder from the taper back into the receiver -->
  <path d="M18 72h24l4 5v35H14V77z" fill="#484848" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <!-- receiver box (steel), 42 wide including the outline; it runs back under the eyepiece -->
  <rect x="12" y="114" width="36" height="70" rx="2" fill="#555555" stroke="#000" stroke-width="6"/>
  <!-- bolt handle on the right: arm + ball -->
  <path d="M46 160l6 6" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <circle cx="53" cy="167" r="4.5" fill="#000"/>
  <!-- top rail, 8 wide: slots where it shows on the reinforce in front of the scope -->
  <rect x="26" y="86" width="8" height="82" fill="#000"/>
  <rect x="28" y="91" width="4" height="2" fill="#555555"/>
  <rect x="28" y="97" width="4" height="2" fill="#555555"/>
  <rect x="28" y="103" width="4" height="2" fill="#555555"/>
  <rect x="28" y="109" width="4" height="2" fill="#555555"/>
  <!-- scope from above, clear of the receiver outlines: bell, tube with the highlight strip, turret saddle with
       side knobs (no wider than the receiver) and elevation cap, eyepiece -->
  <rect x="22" y="120" width="16" height="12" rx="2" fill="#000"/>
  <rect x="25" y="130" width="10" height="38" fill="#000"/>
  <rect x="23" y="166" width="14" height="10" rx="2" fill="#000"/>
  <rect x="28" y="134" width="4" height="11" fill="#8f8f8f"/>
  <rect x="28" y="157" width="4" height="7" fill="#8f8f8f"/>
  <rect x="13" y="147" width="34" height="8" rx="3" fill="#000"/>
  <rect x="21" y="145" width="18" height="12" rx="2" fill="#000"/>
  <circle cx="30" cy="151" r="5" fill="#000"/>
  <!-- bipod clamp band -->
  <rect x="13" y="81" width="34" height="6" rx="1" fill="#000"/>
  <!-- heavy barrel, tapering to the muzzle -->
  <path d="M21 30h18l2 43H19z" fill="#000"/>
  <rect x="28" y="35" width="4" height="32" fill="#555555"/>
  <!-- box muzzle brake (34 x 26, port band across) and the clamp collar behind it -->
  <rect x="18" y="25" width="24" height="7" rx="1" fill="#000"/>
  <path d="M16 1h28l3 3v20l-3 3H16l-3-3V4z" fill="#000"/>
  <rect x="17" y="12" width="26" height="4" fill="#555555"/>
</svg>
