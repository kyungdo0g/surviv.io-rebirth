<svg xmlns="http://www.w3.org/2000/svg" width="48" height="152" viewBox="0 0 48 152">
  <!-- AS Val held sprite, own art (surviv.io-rebirth): top-down view, barrel up, butt flush at the bottom. -->
  <!-- skeleton folding stock from above: one strut, hinge block, butt plate (under the right hand in game) -->
  <rect x="20" y="108" width="8" height="38" fill="#000"/>
  <rect x="12" y="146" width="24" height="6" rx="2" fill="#000"/>
  <rect x="16" y="102" width="16" height="10" rx="1" fill="#000"/>
  <!-- receiver: ribbed top cover; cocking handle on the right at its front, just behind the forend -->
  <path d="M16 72h16v30l-2 2H18l-2-2z" fill="#555555" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M20 84.5h8M20 90.5h8M20 96.5h8" stroke="#000" stroke-width="3"/>
  <rect x="32" y="74" width="6" height="4" fill="#000"/>
  <rect x="36" y="72" width="6" height="8" rx="2" fill="#000"/>
  <!-- warm grey polymer forend round the suppressor's rear, darker centre panel -->
  <path d="M17 54h14l2 2v18H15V56z" fill="#5a524c" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <rect x="21" y="58" width="6" height="14" fill="#463f39"/>
  <!-- fat integral suppressor: the widest part; darker front section, joint ring, rear sight block on its rear -->
  <rect x="14" y="4" width="20" height="52" rx="4" fill="#484848" stroke="#000" stroke-width="8"/>
  <rect x="21" y="10" width="6" height="22" fill="#3a3a3a"/>
  <rect x="8" y="34" width="32" height="5" rx="1" fill="#000"/>
  <rect x="17" y="43" width="14" height="10" rx="1" fill="#000"/>
  <rect x="22" y="45" width="4" height="4" fill="#8f8f8f"/>
  <!-- PSO scope on the left side-rail mount (axis x 12), unpainted aluminium: flared black eyecup and black
       eyepiece at the rear, slim silver tube, turret housing with the black elevation cap, objective bell -->
  <rect x="3" y="101" width="18" height="13" rx="1" fill="#000"/>
  <rect x="2" y="112" width="20" height="7" rx="3" fill="#000"/>
  <rect x="6.5" y="66.5" width="11" height="37" fill="#999999" stroke="#000" stroke-width="5"/>
  <rect x="4.5" y="60.5" width="15" height="8" rx="2" fill="#999999" stroke="#000" stroke-width="5"/>
  <rect x="5.5" y="77.5" width="13" height="15" rx="2" fill="#999999" stroke="#000" stroke-width="5"/>
  <rect x="10" y="63" width="4" height="38" fill="#c4c4c4"/>
  <circle cx="12" cy="84" r="4" fill="#000"/>
  <!-- front sight with ears on the suppressor's front cap -->
  <rect x="18" y="1" width="12" height="8" rx="2" fill="#000"/>
  <rect x="22" y="3" width="4" height="3" fill="#8f8f8f"/>
</svg>
