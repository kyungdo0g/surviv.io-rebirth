<svg xmlns="http://www.w3.org/2000/svg" width="48" height="140" viewBox="0 0 48 140">
  <!-- PP-19 Bizon held sprite, own art (surviv.io-rebirth): top-down view, barrel up, butt flush at the bottom. -->
  <!-- side-folding skeleton stock from above: one strut, hinge block, butt plate (under the right hand in game) -->
  <rect x="20" y="96" width="8" height="40" fill="#000"/>
  <rect x="12" y="134" width="24" height="6" rx="2" fill="#000"/>
  <rect x="16" y="90" width="16" height="10" rx="1" fill="#000"/>
  <!-- helical magazine under the handguard: wider than the gun, rounded nose; ribs on the flanks that peek out -->
  <rect x="6" y="13" width="36" height="50" rx="10" fill="#5a5a5a" stroke="#000" stroke-width="6"/>
  <path d="M6 22.5h9M6 28.5h9M6 34.5h9M6 40.5h9M6 46.5h9M6 52.5h9M6 58.5h9M33 22.5h9M33 28.5h9M33 34.5h9M33 40.5h9M33 46.5h9M33 52.5h9M33 58.5h9" stroke="#3a3a3a" stroke-width="3"/>
  <!-- AK-74 type receiver: dust cover with two ribs and the latch button at the rear -->
  <path d="M15 46h18v42l-2 2H17l-2-2z" fill="#555555" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M19 71.5h10M19 77.5h10" stroke="#000" stroke-width="3"/>
  <rect x="21" y="82" width="6" height="6" fill="#000"/>
  <!-- AK cocking handle on the right, just behind the magazine -->
  <rect x="33" y="66" width="7" height="5" fill="#000"/>
  <rect x="38" y="64" width="6" height="9" rx="3" fill="#000"/>
  <!-- rear sight block with the leaf -->
  <rect x="15" y="38" width="18" height="10" fill="#000"/>
  <rect x="22" y="40" width="4" height="6" fill="#8f8f8f"/>
  <!-- slim upper handguard over the magazine: three slots break the highlight strip -->
  <rect x="18" y="14" width="12" height="26" rx="2" fill="#484848" stroke="#000" stroke-width="6"/>
  <rect x="22" y="17" width="4" height="20" fill="#8f8f8f"/>
  <path d="M21 21.5h6M21 27.5h6M21 33.5h6" stroke="#000" stroke-width="3"/>
  <!-- front sight block with the post, short barrel and compensator -->
  <rect x="17" y="7" width="14" height="8" rx="2" fill="#000"/>
  <rect x="22" y="9" width="4" height="4" fill="#8f8f8f"/>
  <rect x="19" y="1" width="10" height="8" rx="2" fill="#000"/>
</svg>
