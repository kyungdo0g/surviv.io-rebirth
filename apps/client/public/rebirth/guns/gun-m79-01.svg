<svg xmlns="http://www.w3.org/2000/svg" width="56" height="138" viewBox="0 0 56 138">
  <!-- M79 grenade launcher held sprite, own art (surviv.io-rebirth): seen from above, barrel up, butt flush at the bottom; held like a rifle. -->
  <!-- wooden rifle stock, narrow wrist to a wide butt, rubber butt pad, grain -->
  <path d="M20 86h16l4 24v24H16v-24z" fill="#8a4316" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M24 96v30M32 102v26" stroke="#5c2a0c" stroke-width="3"/>
  <rect x="14" y="128" width="28" height="10" rx="2" fill="#000"/>
  <!-- steel receiver with the barrel latch lever sticking out on the right -->
  <rect x="16" y="70" width="24" height="18" rx="2" fill="#555555" stroke="#000" stroke-width="8"/>
  <rect x="22" y="76" width="12" height="6" fill="#454545"/>
  <path d="M40 78h6" stroke="#000" stroke-width="5"/>
  <rect x="44" y="72" width="8" height="12" rx="2" fill="#000"/>
  <!-- wooden fore-end under the tube: wood strips show on both sides -->
  <rect x="4" y="26" width="48" height="40" rx="3" fill="#8a4316" stroke="#000" stroke-width="6"/>
  <!-- fat 40 mm tube with the highlight strip along its top -->
  <rect x="17" y="6" width="22" height="68" rx="2" fill="#555555" stroke="#000" stroke-width="8"/>
  <rect x="25" y="16" width="6" height="52" fill="#8f8f8f"/>
  <!-- folded leaf sight (ladder frame with its aperture slot) and the front sight post at the muzzle -->
  <rect x="18" y="34" width="20" height="22" rx="2" fill="#000"/>
  <path d="M22.5 37v16M33.5 37v16M22 45h12" stroke="#8f8f8f" stroke-width="3"/>
  <rect x="23" y="6" width="10" height="10" rx="1" fill="#000"/>
  <rect x="26" y="9" width="4" height="4" fill="#8f8f8f"/>
</svg>
