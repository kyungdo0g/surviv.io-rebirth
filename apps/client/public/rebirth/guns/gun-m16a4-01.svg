<svg xmlns="http://www.w3.org/2000/svg" width="48" height="220" viewBox="0 0 48 220">
  <!-- M16A4, held sprite seen from above (own art). Barrel up, butt flush at the bottom. -->
  <!-- fixed A2 stock: narrow nose widening to the butt; trapdoor seam and black butt plate -->
  <path d="M17 164h14v4l4 30v18H13v-18l4-30z" fill="#484848" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <path d="M17 206h14" stroke="#3a3a3a" stroke-width="3"/>
  <rect x="9" y="212" width="30" height="8" rx="1" fill="#000"/>
  <!-- flat-top upper receiver; brass deflector and forward assist on the right -->
  <rect x="14" y="116" width="20" height="38" rx="2" fill="#555555" stroke="#000" stroke-width="8"/>
  <path d="M36 128l6 6v8h-6z" fill="#000"/>
  <!-- Picatinny rail: the highlight strip, 3 px slots -->
  <rect x="21" y="118" width="6" height="34" fill="#8f8f8f"/>
  <path d="M21 124h6M21 132h6M21 140h6M21 148h6" stroke="#000" stroke-width="3"/>
  <!-- charging handle T, latch nub on the left -->
  <rect x="9" y="154" width="30" height="6" rx="1" fill="#000"/>
  <rect x="4" y="155" width="6" height="4" rx="1" fill="#000"/>
  <!-- long round A2 handguard with ribs, front cap, delta ring -->
  <rect x="13" y="48" width="22" height="56" rx="5" fill="#484848" stroke="#000" stroke-width="8"/>
  <path d="M19 55h10M19 61h10M19 67h10M19 73h10M19 79h10M19 85h10M19 91h10M19 97h10" stroke="#000" stroke-width="3"/>
  <rect x="16" y="42" width="16" height="6" rx="1" fill="#000"/>
  <rect x="8" y="106" width="32" height="6" rx="1" fill="#000"/>
  <!-- barrel, A2 front sight base (grey post in its ring), A2 birdcage with two port slots -->
  <rect x="20" y="12" width="8" height="32" fill="#000"/>
  <rect x="15" y="22" width="18" height="12" rx="1" fill="#000"/>
  <rect x="20" y="24" width="8" height="8" rx="1" fill="#555555"/>
  <rect x="22" y="26" width="4" height="4" fill="#8f8f8f"/>
  <rect x="17" y="1" width="14" height="13" rx="2" fill="#000"/>
  <rect x="20" y="3" width="2" height="8" fill="#8f8f8f"/>
  <rect x="26" y="3" width="2" height="8" fill="#8f8f8f"/>
</svg>
