<svg xmlns="http://www.w3.org/2000/svg" width="40" height="116" viewBox="0 0 40 116">
  <!-- TEC-9 held sprite, own art (surviv.io-rebirth): seen from above, barrel up, rear flush at the bottom; Dual TEC-9 uses it too. -->
  <!-- boxy receiver (grip and magazine hang below, hidden): steel upper with the highlight strip, rear sight block -->
  <path d="M14 44h12l2 4v62l-2 2H14l-2-2V48z" fill="#484848" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <rect x="15" y="48" width="10" height="58" fill="#555555"/>
  <rect x="18" y="50" width="4" height="44" fill="#8f8f8f"/>
  <rect x="15" y="98" width="10" height="10" fill="#000"/>
  <!-- cocking knob sticking out on the left side (49 % from the rear, just in front of the hands) -->
  <rect x="6" y="56" width="6" height="6" fill="#000"/>
  <rect x="2" y="53" width="6" height="12" rx="2" fill="#000"/>
  <!-- perforated barrel shroud: a row of round holes along its top; front sight post -->
  <rect x="10" y="8" width="20" height="38" rx="2" fill="#555555" stroke="#000" stroke-width="6"/>
  <circle cx="20" cy="18" r="3.5" fill="#000"/>
  <circle cx="20" cy="28" r="3.5" fill="#000"/>
  <circle cx="20" cy="38" r="3.5" fill="#000"/>
  <rect x="17" y="8" width="6" height="5" fill="#000"/>
  <!-- threaded barrel tip -->
  <rect x="16" y="0" width="8" height="9" rx="1" fill="#000"/>
  <rect x="17" y="3" width="6" height="2" fill="#555555"/>
</svg>
