<svg xmlns="http://www.w3.org/2000/svg" width="80" height="212" viewBox="0 0 80 212">
  <!-- M60 held sprite, own art: seen from above, barrel up; folded bipod beside the barrel, OD ammo box on the left. -->
  <!-- tubular stock with a ring, butt plate (under the right hand in game) -->
  <rect x="30" y="170" width="20" height="36" rx="3" fill="#484848" stroke="#000" stroke-width="8"/>
  <rect x="37" y="174" width="6" height="28" fill="#3a3a3a"/>
  <path d="M30 192.5h20" stroke="#000" stroke-width="3"/>
  <rect x="26" y="206" width="28" height="6" rx="2" fill="#000"/>
  <!-- ammo box on the left, drawn before the receiver; lid strip across its rear edge (as on the PKP box) -->
  <rect x="6" y="122" width="26" height="30" rx="2" fill="#4f5e2a" stroke="#000" stroke-width="8"/>
  <rect x="10" y="142" width="14" height="6" fill="#7a9140"/>
  <!-- receiver, rear corners chamfered -->
  <path d="M28 122h24v48l-4 4H32l-4-4z" fill="#555555" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
  <!-- feed cover: the highlight strip; rear sight block behind it -->
  <rect x="37" y="126" width="6" height="22" fill="#8f8f8f"/>
  <rect x="35" y="150" width="10" height="7" rx="1" fill="#000"/>
  <!-- cocking handle, right -->
  <path d="M54 132h6" stroke="#000" stroke-width="5"/>
  <rect x="58" y="126" width="8" height="12" rx="2" fill="#000"/>
  <!-- handguard with a column of oval vents -->
  <rect x="29" y="74" width="22" height="46" rx="3" fill="#484848" stroke="#000" stroke-width="8"/>
  <path d="M37.5 81h5M37.5 87h5M37.5 93h5M37.5 99h5M37.5 105h5M37.5 111h5" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <!-- carry handle folded to the left, in front of the box -->
  <path d="M22 96h6M22 110h6" stroke="#000" stroke-width="4"/>
  <rect x="16" y="92" width="6" height="22" rx="2" fill="#000"/>
  <!-- barrel; gas-cylinder section with two bands -->
  <rect x="35" y="12" width="10" height="64" fill="#000"/>
  <rect x="34" y="54" width="12" height="20" fill="#000"/>
  <rect x="33" y="42" width="14" height="5" rx="1" fill="#000"/>
  <rect x="33" y="51" width="14" height="5" rx="1" fill="#000"/>
  <!-- folded bipod: parallel legs and feet tucked beside the barrel, front sight on the yoke -->
  <rect x="25" y="24" width="6" height="43" rx="2" fill="#000"/>
  <rect x="49" y="24" width="6" height="43" rx="2" fill="#000"/>
  <path d="M28 30v29M52 30v29" stroke="#555555" stroke-width="2"/>
  <rect x="24" y="60" width="8" height="10" rx="2" fill="#000"/>
  <rect x="48" y="60" width="8" height="10" rx="2" fill="#000"/>
  <rect x="31" y="16" width="18" height="10" rx="1" fill="#000"/>
  <rect x="38" y="19" width="4" height="4" fill="#8f8f8f"/>
  <!-- prong flash hider: two prongs, open slot -->
  <path d="M34 2l2-2h2v10h4V0h2l2 2v12H34z" fill="#000"/>
</svg>
