<svg xmlns="http://www.w3.org/2000/svg" width="64" height="196" viewBox="0 0 64 196">
  <!-- M202 FLASH, own art: top view, barrel up, single-use. Wide olive box launcher; the 2x2 rocket tubes poke out in front (top pair seen). -->
  <!-- launcher box, rear end flush at the bottom -->
  <rect x="10" y="44" width="44" height="148" rx="4" fill="#4f5b39" stroke="#000" stroke-width="8"/>
  <rect x="6" y="188" width="52" height="8" rx="2" fill="#000"/>
  <path d="M14 172h36" stroke="#3c4a2e" stroke-width="3"/>
  <!-- copper rocket tubes side by side, sticking out of the box front, black muzzle rims -->
  <rect x="12" y="6" width="18" height="40" rx="2" fill="#b06a3a" stroke="#000" stroke-width="8"/>
  <rect x="34" y="6" width="18" height="40" rx="2" fill="#b06a3a" stroke="#000" stroke-width="8"/>
  <rect x="8" y="2" width="48" height="8" rx="2" fill="#000"/>
  <rect x="6" y="42" width="52" height="6" rx="1" fill="#000"/>
  <!-- sight housing on top near the front, with its window; carry handle along the centre (the highlight strip) -->
  <rect x="18" y="58" width="28" height="26" rx="2" fill="#000"/>
  <rect x="26" y="64" width="12" height="6" fill="#8f8f8f"/>
  <rect x="26" y="106" width="12" height="6" rx="1" fill="#000"/>
  <rect x="26" y="152" width="12" height="6" rx="1" fill="#000"/>
  <rect x="28" y="110" width="8" height="44" fill="#8a9070" stroke="#000" stroke-width="5"/>
</svg>
