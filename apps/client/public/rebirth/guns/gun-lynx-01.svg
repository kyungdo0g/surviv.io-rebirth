<svg xmlns="http://www.w3.org/2000/svg" width="60" height="192" viewBox="0 0 60 192">
  <!-- Gepard GM6 Lynx held sprite, own art: seen from above, barrel up; black anti-materiel bullpup, drawn for gunOffset (-8, 0). -->
  <!-- rear body (action and magazine behind the grip): the widest part; sloping cheek surface as the darker top panel -->
  <rect x="17" y="144" width="26" height="40" rx="1" fill="#484848" stroke="#000" stroke-width="8"/>
  <rect x="25" y="150" width="10" height="30" fill="#3a3a3a"/>
  <!-- square butt -->
  <rect x="12" y="185" width="36" height="7" rx="1" fill="#000"/>
  <!-- upper receiver and handguard: one long railed body, slightly narrower in front -->
  <path d="M19 53h22v59h1v29H18v-29h1z" fill="#484848" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <!-- side rails -->
  <rect x="12" y="58" width="4" height="14" fill="#000"/>
  <rect x="12" y="78" width="4" height="12" fill="#000"/>
  <rect x="44" y="58" width="4" height="14" fill="#000"/>
  <rect x="44" y="78" width="4" height="12" fill="#000"/>
  <!-- top rail: the highlight strip where it shows in front of the scope -->
  <rect x="25" y="52" width="10" height="60" fill="#000"/>
  <rect x="27" y="54" width="6" height="24" fill="#8f8f8f"/>
  <path d="M27 60.5h6M27 67.5h6M27 74.5h6" stroke="#000" stroke-width="3"/>
  <!-- scope from above: bell, tube, rings, turret knobs out both sides with the elevation cap, eyepiece -->
  <rect x="21" y="76" width="18" height="12" rx="2" fill="#000"/>
  <rect x="25" y="86" width="10" height="50" fill="#000"/>
  <rect x="23" y="106" width="14" height="4" fill="#000"/>
  <rect x="23" y="124" width="14" height="4" fill="#000"/>
  <rect x="11" y="112" width="38" height="9" rx="3" fill="#000"/>
  <circle cx="30" cy="116.5" r="4.5" fill="#000"/>
  <rect x="23" y="134" width="14" height="10" rx="2" fill="#000"/>
  <!-- front yoke / bipod clamp -->
  <rect x="15" y="47" width="30" height="9" rx="2" fill="#000"/>
  <!-- long thin barrel -->
  <rect x="26" y="8" width="8" height="41" fill="#000"/>
  <!-- arrowhead muzzle brake, flared at the front -->
  <path d="M22 1h16l-3 9H25z" fill="#000"/>
  <rect x="25" y="4" width="10" height="2" fill="#555555"/>
</svg>
